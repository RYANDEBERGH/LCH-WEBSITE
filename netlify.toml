[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep generated image sizes between builds so deploys stay fast
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["public/_img"]

[[headers]]
  for = "/_img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── Old WordPress URLs → new pages (permanent 301). Generated from docs/redirect-map.csv.
# Netlify matches each rule with or without a trailing slash, so one rule covers both.
# Old pages with no new equivalent (e.g. /corporate) are left out on purpose and return a real 404.
[[redirects]]
  from = "/story"
  to = "/about/"
  status = 301
  force = true
[[redirects]]
  from = "/media"
  to = "/news/"
  status = 301
  force = true
