# ─────────────────────────────────────────────────────────────────────────────
# LCH Developments — Content Manager (Decap CMS)
# Editors use this at https://YOUR-SITE/admin/
# Every save becomes a commit in GitHub, and the site rebuilds automatically.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/lch-website   # ← change to your repository
  branch: main
  commit_messages:
    create: 'Create {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'

# Lets you edit on your own computer with `npm run cms` + `npm run dev`
local_backend: true

# Uncomment to get Draft → In Review → Ready workflow instead of instant publishing
# publish_mode: editorial_workflow

site_url: https://lchdevelopments.com
display_url: https://lchdevelopments.com
logo_url: /uploads/brand/lch-logo-dark.png

media_folder: public/uploads
public_folder: /uploads

collections:
  # ── PROJECTS ──────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    label_singular: Project
    description: Every community and space. Lower “Order” numbers appear first. Tick “Featured” to show a project in the large homepage section.
    folder: src/content/projects
    create: true
    slug: '{{fields.title}}'
    identifier_field: title
    summary: '{{title}} — {{stage}}'
    sortable_fields: [order, title, stage]
    view_groups:
      - { label: Construction stage, field: stage }
    fields:
      - { label: Project name, name: title, widget: string }
      - { label: Assignment, name: assignment, widget: select, default: development, options: [{ label: LCH development, value: development }, { label: Selected client work, value: client }], hint: 'Client work = development/construction management for an owner, lender or receiver. Do not imply LCH owned or originally developed it.' }
      - { label: Role (client work), name: roleLabel, widget: string, required: false, hint: 'e.g. Development and construction management' }
      - { label: Client (client work), name: client, widget: string, required: false }
      - { label: LCH's role and approach, name: approach, widget: text, required: false, hint: 'Short case-study paragraph shown on the project page.' }
      - { label: Construction stage, name: stage, widget: select, required: false, options: ['In Development', 'Under Construction', 'Complete'], hint: 'Leave blank for client work if the stage isn’t public.' }
      - label: Leasing (kept separate from construction)
        name: leasing
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: Leasing status, name: status, widget: select, required: false, options: ['', 'Now Pre-Leasing', 'Now Leasing', 'Join the Waitlist', 'Fully Leased'] }
          - { label: Leasing website, name: url, widget: string, required: false, hint: 'e.g. https://everston.ca — floor plans and pricing stay there.' }
          - { label: What visitors will find there, name: label, widget: string, required: false, hint: 'e.g. Floor plans, pricing, amenities and tours' }
      - { label: Order (1 = first), name: order, widget: number, value_type: int, default: 10 }
      - { label: Featured on homepage, name: featured, widget: boolean, default: false }
      - { label: Hide from website, name: hidden, widget: boolean, default: false, required: false }
      - { label: Product type, name: type, widget: string, hint: 'e.g. Purpose-Built Rental, Condominium, Townhomes' }
      - { label: Short summary (cards & search results), name: summary, widget: text, hint: 'One or two sentences.' }
      - { label: Street address, name: address, widget: string, required: false }
      - { label: Neighbourhood, name: neighbourhood, widget: string, required: false, hint: 'e.g. West Hill, Scarborough' }
      - { label: Major intersection, name: intersection, widget: string, required: false }
      - { label: Number of homes, name: units, widget: number, value_type: int, required: false }
      - { label: Storeys, name: storeys, widget: number, value_type: int, required: false }
      - { label: Partners, name: partners, widget: list, required: false, field: { label: Partner, name: partner, widget: string } }
      - { label: Architect, name: architect, widget: string, required: false }
      - { label: Map latitude, name: lat, widget: number, value_type: float, required: false, hint: 'Right-click the address in Google Maps; the first number is latitude (e.g. 43.77491).' }
      - { label: Map longitude, name: lng, widget: number, value_type: float, required: false, hint: 'The second number (e.g. -79.17928). Leave both blank to keep the project off the map.' }
      - label: Progress milestones
        name: milestones
        widget: list
        required: false
        summary: '{{fields.date}} — {{fields.label}}'
        hint: 'Only verified, dated updates. Use the date it was reported; YYYY-MM is fine when only the month is known.'
        fields:
          - { label: Date (YYYY-MM-DD, YYYY-MM or YYYY), name: date, widget: string, pattern: ['^\d{4}(-\d{2}(-\d{2})?)?$', 'Use YYYY-MM-DD, YYYY-MM or YYYY'] }
          - { label: What happened, name: label, widget: string, hint: 'Say what was reported, e.g. “Reported nearing top-off”, not a confirmed event you can’t date.' }
          - { label: Source, name: source, widget: string, required: false, hint: 'e.g. UrbanToronto, LCH Developments' }
          - { label: Source link, name: sourceUrl, widget: string, required: false }
      - { label: Brand colour, name: brandColor, widget: color, required: false, hint: 'The development’s own colour (from its logo). Used on its project page and map pin; darkened automatically when needed for readable text.' }
      - { label: Project logo, name: logo, widget: image, required: false, hint: 'Transparent PNG or SVG works best.' }
      - { label: Main image, name: heroImage, widget: image, required: false, hint: 'Large landscape image, at least 2000px wide. Label renderings as proposed designs in the caption.' }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        summary: '{{fields.caption}}'
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: Project website
        name: website
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: URL, name: url, widget: string, required: false }
          - { label: Button label, name: label, widget: string, required: false }
      - { label: Description, name: body, widget: markdown }

  # ── NEWS ──────────────────────────────────────────────────────────────────
  - name: news
    label: News & Media
    label_singular: Article
    description: Project updates, press coverage and announcements. Newest first.
    folder: src/content/news
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{date | date("YYYY-MM-DD")}} — {{title}}'
    sortable_fields: [date, title]
    view_groups:
      - { label: Topic, field: topic }
    fields:
      - { label: Headline, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Topic, name: topic, widget: select, options: ['Project Update', 'In the Press', 'Company News', 'Community'] }
      - { label: Related project, name: project, widget: relation, collection: projects, search_fields: [title], value_field: '{{slug}}', display_fields: [title], required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image fit, name: imageFit, widget: select, required: false, options: [{ label: 'Fill (crop to fit) — photos', value: cover }, { label: 'Show whole image — graphics with text', value: contain }] }
      - { label: Publisher, name: publisher, widget: string, required: false, hint: 'For press coverage, e.g. UrbanToronto. Shown in the “In the press” strip.' }
      - { label: Short excerpt, name: excerpt, widget: text, required: false }
      - { label: Link to original article (optional), name: sourceUrl, widget: string, required: false, hint: 'For press coverage — adds a “Read the full article” button.' }
      - { label: Save as draft (hidden from site), name: draft, widget: boolean, default: false, required: false }
      - { label: Article, name: body, widget: markdown, required: false }

  # ── TEAM ──────────────────────────────────────────────────────────────────
  - name: team
    label: Team
    label_singular: Team member
    folder: src/content/team
    create: true
    slug: '{{fields.name}}'
    identifier_field: name
    summary: '{{order}}. {{name}} — {{role}}'
    sortable_fields: [order, name]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Credentials, name: credentials, widget: string, required: false, hint: 'e.g. P.Eng, PMP' }
      - { label: Role, name: role, widget: string }
      - { label: Photo, name: photo, widget: image, required: false, hint: 'Portrait orientation, plain background.' }
      - { label: LinkedIn profile, name: linkedin, widget: string, required: false }
      - { label: Company, name: companies, widget: select, multiple: true, default: [lch], options: [{ label: LCH Developments, value: lch }, { label: Elevate, value: elevate }], hint: 'Controls which team tab this person appears under.' }
      - { label: Order (1 = first), name: order, widget: number, value_type: int, default: 20 }
      - { label: Hide from website, name: hidden, widget: boolean, default: false, required: false }
      - { label: Bio, name: body, widget: markdown }

  # ── SOCIAL POSTS ──────────────────────────────────────────────────────────
  - name: social
    label: Social Posts
    label_singular: Social post
    description: Curated posts from LCH, Elevate, Merge Spaces, Everston and the team. Paste the post's link, pick the account, add the image and a short excerpt.
    folder: src/content/social
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{fields.account}}'
    summary: '{{date | date("YYYY-MM-DD")}} — {{account}} ({{network}})'
    sortable_fields: [date, account]
    fields:
      - { label: Account, name: account, widget: string, hint: 'Exactly as named in Site Settings → Social accounts, e.g. LCH Developments' }
      - { label: Network, name: network, widget: select, options: [linkedin, instagram, facebook] }
      - { label: Date posted, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Related project (optional), name: project, widget: relation, collection: projects, search_fields: [title], value_field: '{{slug}}', display_fields: [title], required: false, hint: 'Also shows the post on that project’s page.' }
      - { label: Link to the post, name: url, widget: string, hint: 'On LinkedIn: ••• → Copy link to post. On Instagram: ••• → Copy link.' }
      - { label: Excerpt, name: text, widget: text, required: false }
      - { label: Image, name: image, widget: image, required: false, hint: 'Square works best.' }
      - { label: Hide, name: hidden, widget: boolean, default: false, required: false }

  # ── SIMPLE PAGES (legal etc.) ─────────────────────────────────────────────
  - name: pages
    label: Legal Pages
    label_singular: Page
    description: Appear at /legal/page-name/
    folder: src/content/pages
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Content, name: body, widget: markdown }

  # ── SITE SETTINGS & PAGE TEXT ─────────────────────────────────────────────
  - name: settings
    label: Site Settings & Pages
    editor: { preview: false }
    files:
      - name: general
        label: General settings (contact, social, banner, colour)
        file: src/data/settings.json
        fields:
          - { label: Company name, name: siteName, widget: string }
          - { label: Search engine description, name: metaDescription, widget: text }
          - { label: Website address, name: siteUrl, widget: string }
          - { label: Logo (on light backgrounds), name: logo, widget: image }
          - { label: Logo (on dark backgrounds / photos), name: logoLight, widget: image }
          - { label: Brand accent colour, name: accentColor, widget: color, hint: 'Used for buttons, links and highlights across the site.' }
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Office address, name: address, widget: string }
          - { label: Google Maps link, name: mapsUrl, widget: string }
          - label: Social media
            name: social
            widget: object
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
          - label: Elevate (affiliated construction manager)
            name: elevate
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Website, name: url, widget: string }
              - { label: Logo (light backgrounds), name: logo, widget: image }
              - { label: Logo (dark backgrounds), name: logoLight, widget: image }
          - label: Social accounts (follow buttons)
            name: socialAccounts
            widget: list
            summary: '{{fields.name}} — {{fields.network}}'
            hint: 'Accounts with a blank link are hidden.'
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Network, name: network, widget: select, options: [linkedin, instagram, facebook] }
              - { label: Link, name: url, widget: string, required: false }
              - { label: Type, name: kind, widget: select, options: [company, person] }
          - label: Social feed section
            name: socialFeed
            widget: object
            fields:
              - { label: Show section, name: enabled, widget: boolean }
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Number of posts, name: count, widget: number, value_type: int, min: 0, max: 12 }
          - label: Announcement banner (top of every page)
            name: announcement
            widget: object
            fields:
              - { label: Show banner, name: enabled, widget: boolean }
              - { label: Text, name: text, widget: string }
              - { label: Link label, name: linkLabel, widget: string, required: false }
              - { label: Link URL, name: url, widget: string, required: false }
              - { label: Banner colour, name: color, widget: color, required: false, hint: 'e.g. the promoted project’s brand colour. Leave blank for the site accent colour.' }
          - label: Newsletter sign-up (footer)
            name: newsletter
            widget: object
            fields:
              - { label: Show sign-up, name: enabled, widget: boolean }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Consent checkbox text, name: consent, widget: text }
              - { label: Mailchimp form URL (optional), name: mailchimpUrl, widget: string, required: false, hint: 'Paste the form action URL from Mailchimp → Audience → Signup forms → Embedded forms (ends in /subscribe/post?u=…&id=…). Leave blank to collect sign-ups in Netlify instead.' }

      - name: home
        label: Homepage
        file: src/data/home.json
        fields:
          - label: Hero (top of page)
            name: hero
            widget: object
            fields:
              - { label: Small text above heading, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Sub-heading, name: subheading, widget: text }
              - { label: Background image, name: image, widget: image }
              - { label: Main button, name: primaryCta, widget: object, fields: [{ label: Label, name: label, widget: string }, { label: Link, name: url, widget: string }] }
              - { label: Second button, name: secondaryCta, widget: object, fields: [{ label: Label, name: label, widget: string, required: false }, { label: Link, name: url, widget: string, required: false }] }
          - label: Key numbers
            name: stats
            widget: list
            summary: '{{fields.value}} — {{fields.label}}'
            fields:
              - { label: Number / word, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Featured projects section
            name: featured
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
          - label: Company overview (below the hero)
            name: overview
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: body, widget: markdown }
              - { label: Link label, name: ctaLabel, widget: string }
              - { label: Link, name: ctaUrl, widget: string }
          - label: How we make it happen
            name: process
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - { label: Stages, name: steps, widget: list, summary: '{{fields.title}}', fields: [{ label: Title, name: title, widget: string }, { label: Text, name: body, widget: text }] }
              - { label: Supporting line, name: footnote, widget: text }
              - { label: Button label, name: ctaLabel, widget: string }
              - { label: Button link, name: ctaUrl, widget: string }
          - label: Map section
            name: map
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string, hint: 'Keep any counts accurate, e.g. five of eight communities on Kingston Road.' }
              - { label: Text, name: body, widget: text }
          - label: Leasing band (e.g. Everston)
            name: leasingBand
            widget: object
            fields:
              - { label: Show, name: enabled, widget: boolean }
              - { label: Project, name: project, widget: relation, collection: projects, search_fields: [title], value_field: '{{slug}}', display_fields: [title] }
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: body, widget: string }
              - { label: Button label, name: ctaLabel, widget: string }
              - { label: Button link, name: ctaUrl, widget: string }
              - { label: Background image, name: image, widget: image }
          - label: LCH and Elevate (also shown on About Us)
            name: elevate
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: body, widget: markdown }
              - { label: LCH leads, name: lch, widget: list }
              - { label: Elevate leads, name: elevateList, widget: list }
              - { label: Photo, name: image, widget: image }
              - { label: Photo description (alt text), name: imageAlt, widget: string }
              - { label: Button label, name: ctaLabel, widget: string }
              - { label: Button link, name: ctaUrl, widget: string }
              - { label: Elevate link label, name: extLabel, widget: string }
              - { label: Elevate link, name: extUrl, widget: string }
          - label: Business enquiry band
            name: business
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: body, widget: text }
              - { label: Button label, name: ctaLabel, widget: string }
              - { label: Button link, name: ctaUrl, widget: string }
              - { label: Second button label, name: secondaryLabel, widget: string }
              - { label: Second button link, name: secondaryUrl, widget: string }
          - label: Press strip
            name: press
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading (screen readers), name: heading, widget: string }
          - label: Latest news section
            name: news
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Number of articles, name: count, widget: number, value_type: int, min: 0, max: 9 }

      - name: story
        label: About Us page
        file: src/data/story.json
        fields:
          - { label: Hero, name: hero, widget: object, fields: [{ label: Small text, name: eyebrow, widget: string }, { label: Heading, name: heading, widget: string }] }
          - { label: Overview, name: overview, widget: object, fields: [{ label: Text, name: body, widget: markdown }, { label: Founders photo, name: image, widget: image }, { label: Photo description (alt text), name: imageAlt, widget: string }] }
          - { label: Values, name: values, widget: list, summary: '{{fields.title}}', fields: [{ label: Title, name: title, widget: string }, { label: Text, name: body, widget: text }] }
          - { label: Timeline heading, name: timelineHeading, widget: object, fields: [{ label: Small text, name: eyebrow, widget: string }, { label: Heading, name: heading, widget: string }] }
          - label: Timeline chapters
            name: timeline
            widget: list
            summary: '{{fields.label}} — {{fields.title}}'
            hint: 'Use a year only where it is confirmed; otherwise use a descriptive label (e.g. “Townhomes and heritage reuse”). Never TBD or question marks.'
            fields:
              - { label: Year or chapter label, name: label, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text (1–2 sentences), name: text, widget: text }
              - label: Photos
                name: images
                widget: list
                required: false
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Description (alt text), name: alt, widget: string }
                  - { label: Label (e.g. Rendering), name: caption, widget: string, required: false }
              - { label: Related projects, name: projects, widget: relation, collection: projects, search_fields: [title], value_field: '{{slug}}', display_fields: [title], multiple: true, required: false }
          - label: Our expertise
            name: expertise
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Areas, name: items, widget: list, summary: '{{fields.title}}', fields: [{ label: Title, name: title, widget: string }, { label: Text, name: body, widget: text }] }
          - label: Selected experience
            name: experience
            widget: object
            fields:
              - { label: Small text, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Case studies
                name: items
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { label: Photo, name: image, widget: image, required: false }
                  - { label: Photo description (alt text), name: imageAlt, widget: string, required: false }
                  - { label: Linked project page, name: project, widget: string, required: false, hint: 'Project page slug, e.g. jefferson-heights. Leave blank if there is no project page.' }
                  - { label: Title, name: title, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Lead sentence, name: heading, widget: string }
                  - { label: Text, name: body, widget: text }
          - { label: Team section, name: team, widget: object, fields: [{ label: Small text, name: eyebrow, widget: string }, { label: Heading, name: heading, widget: string }, { label: Team photo, name: image, widget: image }, { label: Photo description, name: imageAlt, widget: string }] }
          - { label: Closing call to action, name: cta, widget: object, fields: [{ label: Heading, name: heading, widget: string }, { label: Text, name: body, widget: text }, { label: Button label, name: ctaLabel, widget: string }, { label: Button link, name: ctaUrl, widget: string }, { label: Second button label, name: secondaryLabel, widget: string }, { label: Second button link, name: secondaryUrl, widget: string }] }

      - name: contact
        label: Contact page
        file: src/data/contact.json
        fields:
          - { label: Small text, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Show contact form, name: formEnabled, widget: boolean }
          - { label: Thank-you message, name: formSuccess, widget: text }
          - { label: Inquiry types (dropdown), name: inquiryTypes, widget: list }

      - name: partnerships
        label: Partnerships page
        file: src/data/partnerships.json
        fields:
          - { label: Small text, name: eyebrow, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Proof points, name: proof, widget: list, summary: '{{fields.value}} — {{fields.label}}', fields: [{ label: Number / word, name: value, widget: string }, { label: Label, name: label, widget: string }] }
          - label: Who we work with
            name: audiences
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Groups
                name: groups
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { label: Group name, name: label, widget: string }
                  - { label: Partner types, name: items, widget: list, summary: '{{fields.title}}', fields: [{ label: Title, name: title, widget: string }, { label: Text, name: body, widget: text }, { label: Link text, name: cta, widget: string }, { label: Form option to pre-select, name: type, widget: string }] }
          - label: Why partner with LCH
            name: reasons
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Reasons, name: items, widget: list, summary: '{{fields.title}}', fields: [{ label: Title, name: title, widget: string }, { label: Text, name: body, widget: text }, { label: Proof (a real example), name: proof, widget: string }, { label: Proof link, name: link, widget: string, required: false }] }
          - { label: What we look for, name: criteria, widget: object, fields: [{ label: Heading, name: heading, widget: string }, { label: Items, name: items, widget: list }] }
          - { label: How a partnership works, name: process, widget: object, fields: [{ label: Heading, name: heading, widget: string }, { label: Steps, name: steps, widget: list, summary: '{{fields.title}}', fields: [{ label: Title, name: title, widget: string }, { label: Text, name: body, widget: text }] }] }
          - { label: Enquiry form, name: form, widget: object, fields: [{ label: Heading, name: heading, widget: string }, { label: Intro, name: intro, widget: text }, { label: Partner types (dropdown), name: types, widget: list }] }

      - name: map
        label: Map landmarks
        file: src/data/map.json
        fields:
          - label: Landmarks
            name: landmarks
            widget: list
            summary: '{{fields.name}} ({{fields.kind}})'
            hint: 'Parks, landmarks and neighbourhood labels on the Kingston Road map. Streets, transit, water and parks outlines come from OpenStreetMap; project pins come from each project’s latitude/longitude.'
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Type, name: kind, widget: select, options: [nature, landmark, neighbourhood] }
              - { label: Latitude, name: lat, widget: number, value_type: float }
              - { label: Longitude, name: lng, widget: number, value_type: float }
              - { label: Note, name: note, widget: string, required: false }
              - { label: Label position, name: labelPos, widget: select, required: false, options: [right, left, top, bottom] }
          - { label: Road names shown on the map, name: roadLabels, widget: list, hint: 'Exact OpenStreetMap names, e.g. Eglinton Avenue East.' }

      - name: corporate
        label: Corporate page
        file: src/data/corporate.json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Corporations, name: entities, widget: list }
